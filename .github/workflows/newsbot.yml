name: Newsbot - Security News Aggregator

on:
  # Run on schedule (daily at 9 AM UTC)
  schedule:
    - cron: '0 9 * * *'
  
  # Allow manual trigger
  workflow_dispatch:
  
  # Run on push to main (for testing)
  push:
    branches:
      - main

jobs:
  aggregate-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Run Newsbot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python scripts/newsbot.py
          
      - name: Upload results as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: newsbot-results-${{ github.run_number }}
          path: outputs/
          retention-days: 30
          
      - name: Commit and push results
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add outputs/
          git diff --staged --quiet || git commit -m "Add newsbot results from $(date +'%Y-%m-%d')"
          git push
        continue-on-error: true
