name: Publish Docs

on:
  # Manual trigger only - run on-demand from the Actions tab
  # Click "Run workflow" button in the GitHub Actions UI
  workflow_dispatch:


jobs:
  publish-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          
      - name: Publish docs
        run: |
          python scripts/publish_docs.py --clean --all
          
      - name: Commit and push docs
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add docs/
          git diff --staged --quiet || git commit -m "Publish docs from $(date +'%Y-%m-%d')"
          git push
        continue-on-error: true
